<title>GVNET · Mundo 3D NR-10 e NR-35</title>
<style>
:root{--bg:#0f1b2d;--panel:rgba(255,255,255,.94);--ink:#14202e;--mut:#51657a;--acc:#00a86b;--r10:#e5484d;--r35:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(18,28,42,.94);--ink:#eaf1f8;--mut:#9fb2c6}}
:root[data-theme="dark"]{--panel:rgba(18,28,42,.94);--ink:#eaf1f8;--mut:#9fb2c6}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;pointer-events:none}
.pill{background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pill b{color:var(--acc)}
#tog{border:0;color:var(--ink);cursor:pointer}
#bot{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:8px 10px 10px}
#card{background:var(--panel);border-radius:16px;padding:12px 14px;margin-bottom:8px;max-height:36vh;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none}
#card h2{margin:4px 0 6px;font-size:17px}
#card ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
#card li{margin:3px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
.n10{background:var(--r10)}.n35{background:var(--r35)}
#x{float:right;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:0;border-radius:999px;padding:8px 12px;font-size:13px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.chip.v{outline:2px solid var(--acc)}
#hint{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:var(--panel);padding:6px 12px;border-radius:10px;font-size:12px;color:var(--mut);pointer-events:none;transition:opacity .6s;white-space:nowrap}
</style>
</head>
